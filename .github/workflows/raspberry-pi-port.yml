name: raspberry-pi-port

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native-device-core/**"
      - "raspberry-pi-host/**"
      - "scripts/install_pi.sh"
      - ".github/workflows/raspberry-pi-port.yml"
  push:
    branches:
      - "v3/raspberry-pi-port"
    paths:
      - "native-device-core/**"
      - "raspberry-pi-host/**"
      - "scripts/install_pi.sh"
      - ".github/workflows/raspberry-pi-port.yml"

jobs:
  build-arm64:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake

      - name: Check formatting
        run: cargo fmt --check
        working-directory: raspberry-pi-host

      - name: Build Raspberry Pi host
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu
        working-directory: raspberry-pi-host

      - name: Build device core daemon
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu --bin geoteleport-device-core
        working-directory: native-device-core

      - name: Upload Raspberry Pi deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: geoteleport-pi-aarch64
          path: |
            raspberry-pi-host/target/aarch64-unknown-linux-gnu/release/raspberry-pi-host
            native-device-core/target/aarch64-unknown-linux-gnu/release/geoteleport-device-core
            scripts/install_pi.sh
          if-no-files-found: error
