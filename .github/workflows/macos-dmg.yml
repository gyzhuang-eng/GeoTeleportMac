name: macos-dmg

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "GeoTeleportMac/**"
      - "GeoTeleportMac.xcodeproj/**"
      - "native-device-core/**"
      - "build_dmg.sh"
      - ".github/workflows/macos-dmg.yml"
  push:
    branches:
      - "v3/windows-host"
    paths:
      - "GeoTeleportMac/**"
      - "GeoTeleportMac.xcodeproj/**"
      - "native-device-core/**"
      - "build_dmg.sh"
      - ".github/workflows/macos-dmg.yml"

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Show toolchain versions
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          rustc --version
          cargo --version

      - name: Build unsigned DMG
        env:
          RUST_BACKTRACE: "1"
          XCODE_ENABLE_PREVIEWS: "NO"
          XCODE_SWIFT_COMPILATION_MODE: singlefile
          XCODE_SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        run: ./build_dmg.sh

      - name: Upload unsigned DMG
        uses: actions/upload-artifact@v4
        with:
          name: GeoTeleportMacV3-unsigned-dmg
          path: dist/macos/GeoTeleportMacV3.dmg
          if-no-files-found: error
