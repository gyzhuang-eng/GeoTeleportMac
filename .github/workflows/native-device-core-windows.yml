name: native-device-core-windows

on:
  pull_request:
    paths:
      - "native-device-core/**"
      - "scripts/build_windows_core.ps1"
      - ".github/workflows/native-device-core-windows.yml"
  push:
    branches:
      - "v3/windows-host"
    paths:
      - "native-device-core/**"
      - "scripts/build_windows_core.ps1"
      - ".github/workflows/native-device-core-windows.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Windows core
        shell: pwsh
        run: ./scripts/build_windows_core.ps1 -Release

      - name: Upload core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-device-core-windows-x64
          path: |
            native-device-core/target/x86_64-pc-windows-msvc/release/geoteleport-device-core.exe
            native-device-core/target/x86_64-pc-windows-msvc/release/geoteleport_device_core.dll
          if-no-files-found: error
