[package]
name = "raspberry-pi-host"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
axum-server = { version = "0.7.1", features = ["tls-rustls"] }
geoteleport-device-core = { path = "../native-device-core" }
mime_guess = "2.0"
rust-embed = "8.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
